<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Window Injector</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 20px;
      background-color: #f9f9f9;
      color: #333;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    textarea {
      width: 100%;
      height: 150px;
      box-sizing: border-box;
      font-family: monospace;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
      resize: vertical;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

<div class="container">
  <h3>HTML Window Injector</h3>
  <label for="htmlInput">Paste your HTML content here:</label>
  <textarea id="htmlInput" placeholder="<h1>Hello World</h1><p>This is dynamic content.</p>"></textarea>
  <button onclick="injectToNewTab()">Open Content in Blank Tab</button>
</div>

<script>
  function injectToNewTab() {
    // 1. Get the content from the text area
    const content = document.getElementById('htmlInput').value;

    if (!content.trim()) {
      alert("Please enter some HTML code first!");
      return;
    }

    // 2. Open a completely blank native browser tab
    const newTab = window.open('about:blank', '_blank');

    if (newTab) {
      // 3. Open the document stream, write the custom HTML structure, and close it
      newTab.document.open();
      newTab.document.write(content);
      newTab.document.close();
    } else {
      alert("Popup blocked! Please allow popups for this site to open the blank tab.");
    }
  }
</script>

</body>
</html>
